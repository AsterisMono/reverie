# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: files
    files:
      - source: system
        destination: /

  - from-file: nix.yml

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://cli.github.com/packages/rpm/gh-cli.repo
      copr:
        - atim/starship
        - agriffis/neovim-nightly
        - varlad/zellij
    install:
      packages:
        - fish
        - gh
        - terra-release
        - starship
        - ghostty
        - zed
        - neovim
        - python3-neovim
        - tailscale
        - ripgrep
        - atuin
        - zoxide
        - lazygit
        - ibus-rime
        - librime-lua
        - zellij
        - tela-icon-theme
        - yazi
        - loupe
        - gnome-tweaks
        - kleopatra
        - direnv
        - fuse
        - fuse-libs
        - https://downloads.1password.com/linux/rpm/stable/x86_64/1password-latest.rpm
        - https://github.com/clash-verge-rev/clash-verge-rev/releases/download/v2.4.7/Clash.Verge-2.4.7-1.x86_64.rpm
        - https://github.com/xpipe-io/xpipe/releases/latest/download/xpipe-installer-linux-x86_64.rpm
        - https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
    remove:
      packages:
        - nvtop
        - htop

  - type: rpm-ostree
    repos:
      - claude-code.repo
      - netbird.repo
    install:
      - claude-code
      - netbird
      - netbird-ui

  - type: systemd
    system:
      enabled:
        - netbird.service

  - type: script
    scripts:
      - rime-ice.sh

  - type: chezmoi
    repository: "https://github.com/AsterisMono/dotfiles"
    file-conflict-policy: replace

  - type: default-flatpaks
    configurations:
      - notify: false
        install:
          - be.alexandervanhee.gradia
          - com.mattjakeman.ExtensionManager
          - com.slack.Slack
          - com.tencent.wemeet
          - io.github.kolunmi.Bazaar
          - org.mozilla.Thunderbird
          - org.telegram.desktop
          - page.tesk.Refine
          - org.localsend.localsend_app
          - io.missioncenter.MissionCenter
          - io.github.pwr_solaar.solaar

  - type: gnome-extensions
    install:
      - 615 # AppIndicator and KStatusNotifierItem Support
      - 3193 # Blur my Shell
      - 517 # Caffeine
      - 779 # Clipboard Indicator
      - 1160 # Dash to Panel
      - 6807 # System Monitor
      - 6099 # PaperWM
      - 307 # Dash to Dock

  - type: gschema-overrides
    include:
      - zz1-gnome.gschema.override

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  - type: signing
