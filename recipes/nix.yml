# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: script
    snippets:
      - "mkdir -p /nix && chmod 0755 /nix"

  - type: dnf
    install:
      packages:
        - nix
        - nix-daemon

  - type: systemd
    system:
      enabled:
        - nix.mount
        - nix-daemon.service
